
name: Cartoes Microservice CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'jsn-cartoes-ms/**'
      - '.github/workflows/cartoes-ci.yml'

  pull_request:
    branches: [main, develop]
    paths:
      - 'jsn-cartoes-ms/**'
      - '.github/workflows/cartoes-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartoes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test Cartoes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jsn-cartoes-ms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: jsn-cartoes-ms/pom.xml

      - name: Maven Verify
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoes-test-reports
          path: |
            jsn-cartoes-ms/target/surefire-reports/**
            jsn-cartoes-ms/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cartoes-application
          path: jsn-cartoes-ms/target/*.jar
          if-no-files-found: error
          retention-days: 14
