
name: Emissor Microservice CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'jsn-emissor-ms/**'
      - '.github/workflows/emissor-ci.yml'

  pull_request:
    branches: [master, develop]
    paths:
      - 'jsn-emissor-ms/**'
      - '.github/workflows/emissor-ci.yml'

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: emissor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test - Java 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jsn-emissor-ms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: jsn-emissor-ms/pom.xml

      - name: Verify Java and Maven
        run: |
          java -version
          ./mvnw --version

      - name: Build and Verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emissor-test-reports
          path: |
            jsn-emissor-ms/target/surefire-reports/**
            jsn-emissor-ms/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emissor-jacoco
          path: jsn-emissor-ms/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: emissor-application
          path: jsn-emissor-ms/target/*.jar
          if-no-files-found: error
          retention-days: 14

  code-quality:
    name: Static Code Analysis - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for CodeQL
        working-directory: jsn-emissor-ms
        run: ./mvnw -B -ntp clean compile

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
