
name: Enterprise Spring Boot Microservice CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1 - BUILD AND TEST
  # ==========================================

  build:
    name: Build and Test - Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Maven Wrapper
        run: chmod +x mvnw

      - name: Verify Java and Maven
        run: |
          java -version
          ./mvnw --version

      - name: Compile Application
        run: ./mvnw -B -ntp clean compile

      - name: Run Unit and Integration Tests
        run: ./mvnw -B -ntp verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # JOB 2 - STATIC CODE ANALYSIS
  # ==========================================

  code-quality:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ==========================================
  # JOB 3 - DEPENDENCY SECURITY
  # ==========================================

  dependency-audit:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Review Dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
