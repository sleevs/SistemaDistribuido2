
spring.application.name=jsn-cartoes-ms

server.port=8082
server.servlet.context-path=/jsn-cartoes-ms


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true



# ===============================
# KAFKA
# ===============================

# Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000

# Configuração do Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=emissor-group

# Configuração do tópico Kafka onde a mensagem será enviada
kafka.topic.cartao=pedido-creado
#kafka.topic.cartao=cartao-emitido-dead-letter



spring.datasource.url=jdbc:postgresql://localhost:5437/cartao_db
spring.datasource.username=jsn
spring.datasource.password=maximus

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# ddl-auto options: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update

# Shows SQL queries in the console (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect for optimization
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIKARI CONNECTION POOL SETTINGS (Optional but Recommended)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000


