

spring.thymeleaf.cache=false
spring.main.show-banner=false
logging.level.jdbc=OFF
logging.level.jdbc.sqltiming=DEBUG
logging.level.jdbc.resultsettable=DEBUG

spring.application.name=jsn-notification-ms

server.port=8084
server.servlet.context-path=/jsn-notification-ms

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.protocol=smtp
spring.mail.test-connection=false


# ===============================
# KAFKA
# ===============================

# Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000

# Configuração do Kafka Consumer
spring.kafka.bootstrap-servers=192.168.1.37:9092,192.168.1.104:9092,192.168.1.10:9092
spring.kafka.consumer.group-id=notificacao-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Configuração do tópico Kafka que será consumido
kafka.topic.cartao=cartao-emitido-dead-letter


spring.datasource.url=jdbc:postgresql://localhost:5435/notification_db
spring.datasource.username=jsn
spring.datasource.password=maximus

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# ddl-auto options: none, validate, update, create, create-drop
spring.jpa.hibernate.ddl-auto=update

# Shows SQL queries in the console (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect for optimization
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIKARI CONNECTION POOL SETTINGS (Optional but Recommended)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000